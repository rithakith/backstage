      accessKeyId: ${AWS_ACCESS_KEY_ID}
      secretAccessKey: ${AWS_SECRET_ACCESS_KEY}

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow:
        - Component
        - API
        - Resource
        - System
        - Domain
        - Location
        - User
        - Group
  providers:
    azureBlob:
      accountName: ${ACCOUNT_NAME}
      containerName: ${CONTAINER_NAME}
      schedule: # same options as in TaskScheduleDefinition
        # supports cron, ISO duration, "human duration" as used in code
        frequency: { minutes: 30 }
        # supports ISO duration, "human duration" as used in code
        timeout: { minutes: 3 }
    asgardeo:
      roleAttribute: asgardeo_role
    wso2Apim:
      baseUrl: https://localhost:9447
      username: admin  
      password: admin
    backstageOpenapi:
      plugins:
        - catalog
        - search
  locations:
    # Add a location here to ingest it, for example from a URL:
    #
    #     - type: url
    #       target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all.yaml
    #
    # For local development you can use a file location instead:
    #
    #     - type: file
    #       target: ../catalog-model/examples/all-components.yaml
    #
    # File locations are relative to the current working directory of the
    # backend, for example packages/backend/.

    # Your company's catalog (teams, users, APIs, systems, components)
    - type: file
      target: ../../catalog/all.yaml

    # Backstage example entities
    - type: file
      target: ../catalog-model/examples/all.yaml
    # Backstage example groups and users
    - type: file
      target: ../catalog-model/examples/acme-corp.yaml
      rules:
        - allow: [User, Group]
    # Example component for TechDocs
    - type: file
      target: ../../plugins/techdocs-backend/examples/documented-component/catalog-info.yaml
    # Backstage example templates
    - type: file
      target: ../../plugins/scaffolder-backend/sample-templates/all-templates.yaml
      rules:
        - allow: [Template]

scaffolder:
  auditor:
    taskParameterMaxLength: 256
  # Use to customize default commit author info used when new components are created
  defaultAuthor:
    name: Scaffolder
    email: scaffolder@backstage.io
  # Use to customize the default commit message when new components are created
  defaultCommitMessage: 'Initial commit'
  defaultEnvironment:
    parameters:
      region: eu-west-1
    secrets:
      environment: ${NODE_ENV}

auth:
  environment: development
  session:
    secret: super-long-random-string-at-least-32-characters-123456
  providers:
    oidc:
      development:
        clientId: FF1Ta0Ik9HoU18TbC8G_fOsQPBYa
        clientSecret: UU0FWPdhvMf6PaDIxwU5zxiw3G5I0oMflKpf9ruQ6Zca
        metadataUrl: https://api.asgardeo.io/t/backstageplugin/oauth2/token/.well-known/openid-configuration
        additionalScopes: 'apim:api_create apim:api_publish'
        prompt: login
    # WSO2 API Manager OAuth provider - for accessing DevPortal APIs with user identity
    wso2apim:
      development:
        clientId: ${WSO2_APIM_CLIENT_ID}
        clientSecret: ${WSO2_APIM_CLIENT_SECRET}
        metadataUrl: https://localhost:9447/oauth2/token/.well-known/openid-configuration
        additionalScopes: 'apim:subscribe apim:api_view apim:mcp_server_view apim:mcp_server_create apim:mcp_server_publish apim:mcp_server_generate_key apim:llm_provider_read'
        prompt: login
#        signIn:
