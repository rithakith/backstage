app:
  title: Backstage Example App
  baseUrl: http://localhost:3000
  packages: all # ✨

  #datadogRum:
  #  clientToken: '123456789'
  #  applicationId: qwerty
  #   site: # datadoghq.eu default = datadoghq.com
  #   env: # optional
  #   sessionSampleRate: 100
  #   sessionReplaySampleRate: 0

  support:
    url: https://github.com/backstage/backstage/issues # Used by common ErrorPage
    items: # Used by common SupportButton component
      - title: Issues
        icon: github
        links:
          - url: https://github.com/backstage/backstage/issues
            title: GitHub Issues
      - title: Discord Chatroom
        icon: chat
        links:
          - url: https://discord.gg/backstage-687207715902193673
            title: '#backstage'

  packageName: example-app

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  # auth:
  #   keys:
  #     - secret: ${BACKEND_SECRET}

  logLevel: debug

  # Used for testing rate limiting locally
  # rateLimit:
  #   windowMs: 1m
  #   incomingRequestLimit: 1
  #   ipAllowList: []

  auth:
    # TODO: once plugins have been migrated we can remove this, but right now it
    # is require for the backend-next to work in this repo
    dangerouslyDisableDefaultAuthPolicy: true

  baseUrl: http://localhost:7007
  listen:
    port: 7007
  database:
    client: better-sqlite3
    connection:
      directory: ./.backstage-data
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  reading:
    allow:
      - host: example.com
      - host: '*.mozilla.org'
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir
  actions:
    pluginSources:
      - catalog
# See README.md in the proxy-backend plugin for information on the configuration format
proxy:
  endpoints:
    '/pagerduty':
      target: https://api.pagerduty.com
      headers:
        Authorization: Token token=${PAGERDUTY_TOKEN}

wso2ApiManager:
  baseUrl: https://localhost:9447
  devportalBasePath: /api/am/devportal/v3
  publisherBasePath: /api/am/publisher/v4
  tls:
    rejectUnauthorized: false
  auth:
    # clientId: QEJhb4NYrsYQmkTk_dNP46pUxkYa
    # clientSecret: Zc9n5JjEk6vqNxVwyou7M6p5TZoa
    # admin credentials
    clientId: Qo43wtmF__iUV4vvMsVsG0LGnwIa
    clientSecret: QJTEhUuX25QEStcfRmPU6s06Mmga
    # subadmin credentials 
    # clientId: 1NI3PnMIzB5L8wtPJFlti5wtA5Ia
    # clientSecret: BazBBkiF9CLW2M6ynZNa7sdcf3wa
    # Use jwt-bearer grant - exchanges Asgardeo token for WSO2 APIM token
    # The user's Asgardeo token is forwarded from Backstage frontend
    # WSO2 APIM must be configured to trust Asgardeo as a federated IdP
    tokenUrl: https://localhost:9447/oauth2/token
    grantType: jwt-bearer

organization:
  name: My Company

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    runIn: 'docker'
    # dockerImage: my-org/techdocs # use a custom docker image
    # pullImage: true # or false to disable automatic pulling of image (e.g. if custom docker login is required)
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3' or 'azureBlobStorage' or 'openStackSwift'. Read documentation for using alternatives.

